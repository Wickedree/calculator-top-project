<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="calculator-container">
        <div id="calculator-screen">
            <div id="number-input">0</div>
            <div id="result"></div>
        </div>

        <div class="calculator-keyboard-container">
            <button class="clear">C</button>
            <button class="delete">DEL</button>
            <button class="operation">%</button>
            <button class="operation">/</button>

            <button class="number" onclick="getNumber(7)">7</button>
            <button class="number" onclick="getNumber(8)">8</button>
            <button class="number" onclick="getNumber(9)">9</button>
            <button class="operation">x</button>

            <button class="number" onclick="getNumber(4)">4</button>
            <button class="number" onclick="getNumber(5)">5</button>
            <button class="number" onclick="getNumber(6)">6</button>
            <button class="operation">-</button>

            <button class="number" onclick="getNumber(1)">1</button>
            <button class="number" onclick="getNumber(2)">2</button>
            <button class="number" onclick="getNumber(3)">3</button>
            <button class="operation">+</button>

            <button>()</button>
            <button class="number" onclick="getNumber(0)">0</button>
            <button>,</button>
            <button class="operation">=</button>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
